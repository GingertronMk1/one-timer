name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    name: Style and tests
    runs-on: ubuntu-latest
    env:
      WWWGROUP: 1001
      WWWUSER: 1001
      DB_DATABASE: sail
      DB_USERNAME: sail
      DB_PASSWORD: password
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Prepare Sail
        run: |
          cp .env.example .env
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --volume "$PWD:/app" \
            --workdir /app \
            composer:2 install --no-interaction --prefer-dist --no-progress --no-scripts --ignore-platform-reqs

      - name: Cache Sail images
        id: sail-images
        uses: actions/cache@v6
        with:
          path: /tmp/sail-images.tar
          key: ${{ runner.os }}-sail-images-${{ hashFiles('composer.lock', 'compose.yaml') }}

      - name: Restore Sail images
        if: steps.sail-images.outputs.cache-hit == 'true'
        run: docker load --input /tmp/sail-images.tar

      - name: Build and cache Sail images
        if: steps.sail-images.outputs.cache-hit != 'true'
        run: |
          vendor/bin/sail build
          docker compose pull --ignore-buildable
          mapfile -t images < <(docker compose config --images)
          docker save --output /tmp/sail-images.tar "${images[@]}"

      - name: Start Sail
        run: vendor/bin/sail up -d --no-build

      - name: Install dependencies
        run: |
          vendor/bin/sail composer install --no-interaction --prefer-dist --no-progress
          vendor/bin/sail npm ci --ignore-scripts

      - name: Prepare application
        id: setup
        run: |
          vendor/bin/sail artisan key:generate --no-interaction
          vendor/bin/sail npm run build

      - name: Check PHP style
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: vendor/bin/sail bin pint --test

      - name: Check frontend formatting
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: vendor/bin/sail npm run format:check

      - name: Run tests with coverage
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: vendor/bin/sail composer test

      - name: Run browser tests
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          cp .env .env.dusk.local
          printf '\nAPP_URL=http://laravel.test\nDB_CONNECTION=sqlite\nDB_DATABASE=/var/www/html/database/dusk.sqlite\nSESSION_DRIVER=file\n' >> .env.dusk.local
          touch database/dusk.sqlite
          vendor/bin/sail dusk

      - name: Upload browser test artifacts
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-artifacts
          path: |
            tests/Browser/screenshots
            tests/Browser/console
            tests/Browser/source
          if-no-files-found: ignore

  dependabot:
    name: Merge Dependabot pull requests
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]' }}
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Enable auto-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: gh pr merge --auto --squash --match-head-commit "$HEAD_SHA" "$PR_URL"
